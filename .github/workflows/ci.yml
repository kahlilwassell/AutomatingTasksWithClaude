# Build, style-check and test on every PR and every push to main.
# Azure DevOps equivalent: pipelines/azure-pipelines.yml
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Unit tests
        run: >
          dotnet test tests/ShipmentTracker.UnitTests
          --configuration Release --no-build
          --logger "trx;LogFileName=unit.trx" --results-directory TestResults

      # GitHub-hosted Ubuntu runners have Docker, so Testcontainers just works.
      - name: Integration tests
        run: >
          dotnet test tests/ShipmentTracker.IntegrationTests
          --configuration Release --no-build
          --logger "trx;LogFileName=integration.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx

  docker-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build container image
        run: docker build -t shipment-tracker-api:${{ github.sha }} .
