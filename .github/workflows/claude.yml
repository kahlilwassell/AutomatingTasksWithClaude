# Interactive Claude: mention @claude in an issue, PR comment or review comment.
#   "@claude implement this issue"        -> Claude pushes a branch and opens a PR
#   "@claude why is CI failing here?"     -> Claude reads the logs and replies
# Setup: run /install-github-app in Claude Code (or see docs/github-setup notes in README).
# Requires repo secret ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Claude needs the SDK to build and run tests before pushing.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - uses: anthropics/claude-code-action@v1
        with:
          # Use ONE of these, matching the secret you created.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 30
            --allowedTools "Bash(dotnet build *),Bash(dotnet test *),Bash(dotnet format *),Bash(git *)"
