# Local development stack.
#   docker compose up -d db          -> just PostgreSQL (run the API with `dotnet run`)
#   docker compose up --build        -> PostgreSQL + the API in a container on :8080
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shipment_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shipment_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ShipmentTracker: "Host=db;Port=5432;Database=shipment_tracker;Username=postgres;Password=postgres"
      Database__EnsureCreatedOnStartup: "true"
    ports:
      - "8080:8080"

volumes:
  pgdata:
